# Path-based labels (intended for actions/labeler v5).
# The workflow that applies this file is not included by default; add it when
# label automation is wanted.

"area: handlers":
  - changed-files:
      - any-glob-to-any-file: "src/bot/handlers/**"

"area: ui":
  - changed-files:
      - any-glob-to-any-file:
          - "src/bot/keyboards/**"
          - "src/bot/views.py"
          - "src/bot/ui.py"

"area: services":
  - changed-files:
      - any-glob-to-any-file: "src/services/**"

"area: database":
  - changed-files:
      - any-glob-to-any-file:
          - "src/database/**"
          - "artifacts/database/**"

"area: i18n":
  - changed-files:
      - any-glob-to-any-file: "src/localization/**"

"area: infra":
  - changed-files:
      - any-glob-to-any-file:
          - "Dockerfile"
          - "docker-compose.yml"
          - ".github/workflows/**"
          - "requirements*.txt"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"
          - "manifest/**"

"tests":
  - changed-files:
      - any-glob-to-any-file: "tests/**"

"security":
  - changed-files:
      - any-glob-to-any-file:
          - "SECURITY.md"
          - "src/utils/text.py"
          - "src/core/config.py"
